{% extends 'base.html' %}

{% block content %}
    <ul>
        <h3>{{ object.name }}</h3>
        <p>Author: {{ object.author }}</p>
        {% for ingredient in object.ingredient.all %}
            <li>{{ ingredient.ingredient.name }}</li>
        {% endfor %}
        <br>
        <a href="/recipes/list">Back to List</a>
    </ul>
{% endblock %}
