{% extends 'base.html' %}

{% block content %}
{% if form.errors %}
    {% for field in form %}
        {% for error in field %}
            {{ error }}
        {% endfor %}
    {% endfor %}
{% endif %}
    <h1>Request Password Reset</h1>
    <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Request Password Reset Link</button>
    </form>
{% endblock %}
